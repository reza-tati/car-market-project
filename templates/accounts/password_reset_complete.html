{% extends 'base.html' %}

{% block title %}رمز عبور تغییر کرد{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header success-header">
            <div class="auth-icon success-icon"><i class="bi bi-check-circle-fill"></i></div>
            <h3 class="auth-title">رمز عبور تغییر کرد!</h3>
            <p class="auth-subtitle">می‌توانید با رمز جدید وارد شوید</p>
        </div>
        <div class="auth-body text-center">
            <p class="text-muted mb-4">
                رمز عبور شما با موفقیت تغییر کرد. حالا می‌توانید با رمز جدید وارد شوید.
            </p>
            <a href="{% url 'accounts:login' %}" class="btn-auth">
                <i class="bi bi-box-arrow-in-right"></i>
                ورود به حساب
            </a>
        </div>
    </div>
</div>

<style>
    .success-header {
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        color: white;
        padding: 2.5rem 1.5rem 2rem;
        text-align: center;
    }
    .success-icon {
        width: 90px; height: 90px;
        background: rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 1rem;
        font-size: 3rem;
    }
</style>
{% endblock %}
