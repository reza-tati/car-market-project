{% extends 'base.html' %}

{% block title %}فراموشی رمز عبور{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header" style="background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);">
            <div class="auth-icon"><i class="bi bi-key-fill"></i></div>
            <h3 class="auth-title">فراموشی رمز عبور</h3>
            <p class="auth-subtitle">ایمیل خود را وارد کنید تا لینک بازیابی ارسال شود</p>
        </div>
        <div class="auth-body">
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="id_email" class="form-label">
                        <i class="bi bi-envelope text-warning"></i>
                        ایمیل
                    </label>
                    <input type="email" name="email" class="form-control" id="id_email" 
                           placeholder="example@email.com" required>
                </div>
                <button type="submit" class="btn-auth w-100" style="background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);">
                    <i class="bi bi-send"></i>
                    ارسال لینک بازیابی
                </button>
            </form>
            <div class="auth-footer">
                <p class="mb-0">
                    <a href="{% url 'accounts:login' %}" class="register-link">
                        <i class="bi bi-arrow-right"></i>
                        بازگشت به صفحه ورود
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
