{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}ورود به حساب کاربری{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> ورود به حساب کاربری</h4>
                </div>
                <div class="card-body">
                    
                    {% if form.errors %}
                    <div class="alert alert-danger">
                        نام کاربری یا رمز عبور نادرست است.
                    </div>
                    {% endif %}
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">شماره موبایل</label>
                            <input type="text" name="username" class="form-control" id="id_username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_password" class="form-label">رمز عبور</label>
                            <input type="password" name="password" class="form-control" id="id_password" required>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember_me">
                            <label class="form-check-label" for="remember_me">مرا به خاطر بسپار</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-key"></i> ورود
                        </button>
                        
                        <div class="text-center mt-3">
                            <a href="{% url 'accounts:register' %}">حساب کاربری ندارید؟ ثبت‌نام کنید</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
