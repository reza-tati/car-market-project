{% extends 'base.html' %}

{% block title %}حذف موتورسیکلت{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                    <h4 class="mt-3">آیا مطمئن هستید؟</h4>
                    <p class="text-muted">آیا میخواهید "{{ object.title }}" را حذف کنید؟ این عمل قابل بازگشت نیست.</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger rounded-pill px-4">
                            <i class="bi bi-trash"></i> بله، حذف کن
                        </button>
                        <a href="{% url 'cars:motorcycle_detail' object.pk object.slug %}" class="btn btn-outline-secondary rounded-pill px-4">
                            انصراف
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
